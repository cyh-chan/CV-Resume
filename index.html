<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume - cyh-chan</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #525659;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
    .fallback a {
      margin-top: 12px;
      color: #4da3ff;
      font-size: 1.1rem;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <iframe src="resume.pdf" type="application/pdf">
    <div class="fallback">
      <p>Your browser does not support inline PDF viewing.</p>
      <a href="resume.pdf" download>Click here to download the resume</a>
    </div>
  </iframe>
</body>
</html>
